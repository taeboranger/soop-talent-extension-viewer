<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>SoopTalent 달란트 시장</title>
<style>
  :root {
    --bg:#ffffff; --bg-soft:#f4f6fb; --bg-inset:#e8ecf5;
    --fg:#161a22; --fg-muted:#5b6272; --line:#d6dbe6;
    --accent:#1a56db; --accent-fg:#ffffff;
    --ok:#1a7f52; --warn:#97620a; --bad:#b3261e;
    --ok-bg:#e6f4ec; --warn-bg:#fdf3e2; --bad-bg:#fdecea;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg:#12151c; --bg-soft:#1a1e28; --bg-inset:#232837;
      --fg:#e4e8f0; --fg-muted:#949cae; --line:#303648;
      --accent:#6aa4ff; --accent-fg:#0b1220;
      --ok:#63cd97; --warn:#e0ab5a; --bad:#f2837b;
      --ok-bg:#16281f; --warn-bg:#2e2617; --bad-bg:#2e1d1c;
    }
  }
  * { box-sizing:border-box; }
  body { width:310px; margin:0; padding:14px; background:var(--bg); color:var(--fg);
         font:14px/1.55 "Pretendard","Malgun Gothic","Segoe UI",system-ui,sans-serif; }
  h1 { font-size:16px; margin:0 0 4px; }
  p { margin:0 0 10px; }
  .muted { color:var(--fg-muted); font-size:12.5px; }
  .field { display:flex; flex-direction:column; gap:5px; margin-bottom:12px; }
  label { font-weight:600; font-size:13px; }
  input { font:inherit; padding:8px 10px; border:1px solid var(--line);
          border-radius:6px; background:var(--bg); color:var(--fg); width:100%; }
  button { font:inherit; padding:8px 13px; border:1px solid var(--accent);
           border-radius:6px; background:var(--accent); color:var(--accent-fg);
           font-weight:600; cursor:pointer; width:100%; }
  button:hover:not(:disabled) { filter:brightness(1.08); }
  button:disabled { opacity:.55; cursor:not-allowed; }
  button.ghost { width:auto; background:none; color:var(--fg-muted);
                 border-color:var(--line); font-weight:500;
                 padding:3px 9px; font-size:12px; }

  /* 연결 상태 — 색뿐 아니라 앞의 기호로도 구분되게 한다 */
  .conn { display:flex; align-items:center; justify-content:space-between;
          gap:8px; margin-bottom:12px; }
  .badge { display:inline-flex; align-items:center; gap:5px; padding:3px 9px;
           border-radius:999px; font-size:12.5px; font-weight:600; white-space:nowrap; }
  .badge::before { font-weight:700; }
  .badge.ok   { background:var(--ok-bg);   color:var(--ok); }   .badge.ok::before   { content:"●"; }
  .badge.warn { background:var(--warn-bg); color:var(--warn); } .badge.warn::before { content:"▲"; }
  .badge.bad  { background:var(--bad-bg);  color:var(--bad); }  .badge.bad::before  { content:"■"; }
  .conn .d { font-size:11.5px; color:var(--fg-muted); overflow:hidden;
             text-overflow:ellipsis; white-space:nowrap; }
  :focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
  .notice { border-radius:6px; padding:9px 11px; margin-top:11px; font-size:13px; }
  .notice.ok { background:var(--ok-bg); color:var(--ok); }
  .notice.bad { background:var(--bad-bg); color:var(--bad); }
  .notice:empty { display:none; }
  .card { background:var(--bg-soft); border:1px solid var(--line);
          border-radius:8px; padding:11px 13px; margin-top:12px; font-size:12.5px;
          color:var(--fg-muted); }
</style>
</head>
<body>
  <h1>달란트 시장</h1>
  <p class="muted">SoopTalent 서비스에 자동으로 연결됩니다.</p>

  <!-- 팝업을 열 때마다 실제로 닿는지 확인한다.
       구매 버튼이 안 보이는 이유가 여기서 대부분 드러난다. -->
  <div class="conn">
    <span class="badge warn" id="connBadge">확인 중</span>
    <span class="d" id="connDetail"></span>
    <button class="ghost" id="recheck">다시 확인</button>
  </div>

  <div class="card">
    스트리머가 <strong>달란트 시장</strong>으로 연 게시글에 들어가면
    보유 달란트와 보상 목록이 표시됩니다.
    보상을 고르면 댓글 입력창에 신청 문구가 채워집니다 — 확인 후 직접 등록하세요.
  </div>

  <script src="popup.js"></script>
</body>
</html>
